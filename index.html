<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chuanontree</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="win">

  <!-- 分頁列(由 js 動態產生) -->
  <div class="strip" id="strip"></div>

  <!-- 工具列 -->
  <div class="bar">
    <button class="nav" id="back"  title="上一頁"><svg viewBox="0 0 24 24"><path d="M15.7 5.7 14.3 4.3 6.6 12l7.7 7.7 1.4-1.4L9.4 12z"/></svg></button>
    <button class="nav" id="fwd"   title="下一頁"><svg viewBox="0 0 24 24"><path d="M8.3 5.7 9.7 4.3 17.4 12l-7.7 7.7-1.4-1.4L14.6 12z"/></svg></button>
    <button class="nav" id="reload" title="重新整理"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.2 1.8L13 11h7V4z"/></svg></button>
    <div class="omni">
      <svg id="lock" viewBox="0 0 24 24"><path d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-4 0 2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 10 0v2zM12 3a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3"/></svg>
      <input id="url" type="text" spellcheck="false" placeholder="搜尋 Google 或輸入網址" autocomplete="off">
      <svg class="star" viewBox="0 0 24 24"><path d="m12 17.3 6.2 3.7-1.6-7 5.4-4.7-7.1-.6L12 2 9.1 8.7 2 9.3l5.4 4.7-1.6 7z"/></svg>
    </div>
    <button class="nav" title="擴充功能"><svg viewBox="0 0 24 24"><path d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5"/></svg></button>
    <button class="nav" title="帳戶"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4m0 2c-3 0-8 1.5-8 4.5V21h16v-2.5c0-3-5-4.5-8-4.5"/></svg></button>
    <button class="nav" title="更多"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0-2-2 2 2 0 0 0 2 2m0 2a2 2 0 1 0 2 2 2 2 0 0 0-2-2m0 6a2 2 0 1 0 2 2 2 2 0 0 0-2-2"/></svg></button>
  </div>

  <!-- 內容區:iframe 會動態塞進來 -->
  <div class="view" id="view">

    <!-- ★ 你的畫布:起始頁 ─ 換成你的內容 -->
    <div class="page" id="startpage">
      <div class="mark">chuanontree</div>
      <div class="fakebox">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
        <input id="sbox" placeholder="搜尋 Google 或輸入網址" spellcheck="false" autocomplete="off">
      </div>
      <div class="shorts" id="shorts"><!-- 由 config.js 產生 --></div>
    </div>

    <!-- ★ 你的畫布:拒絕頁 ─ 你的作者發言位置 -->
    <div class="page" id="rupture">
      <div class="inner">
        <div class="code">X-FRAME-OPTIONS · DENY</div>
        <h1><span class="host" id="rhost">這個網站</span> 拒絕被我的介面收編。</h1>
        <p>它送回一道標頭,告訴瀏覽器:不要把我裝進別人的框裡。真實的網路保有它自己的主權——而你正看著這道邊界。</p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/browser.js"></script>
</body>
</html>
