name: Build desktop app

# 在 GitHub 的 Mac / Windows 機器上打包電腦版,
# 發佈到 Releases 的「desktop-latest」,下載後雙擊即可開啟。
on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            asset: chuanontree-mac.zip
          - os: windows-latest
            script: package:win
            asset: chuanontree-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

      # 沒有 Apple 開發者憑證:做 ad-hoc 簽章,Apple Silicon 才能執行
      - if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/chuanontree-darwin-universal/chuanontree.app
          ditto -c -k --keepParent dist/chuanontree-darwin-universal/chuanontree.app ${{ matrix.asset }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/chuanontree-win32-x64 -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest chuanontree-mac.zip chuanontree-windows.zip \
            --target "$GITHUB_SHA" --latest \
            --title "偽 Chrome 電腦版(最新)" \
            --notes "Mac:下載 chuanontree-mac.zip,解壓縮後把 chuanontree 拖進「應用程式」。第一次開啟若被擋下,到「系統設定 → 隱私權與安全性」按「仍要打開」。
          Windows:下載 chuanontree-windows.zip,解壓縮後執行資料夾裡的 chuanontree.exe;若出現 SmartScreen,按「其他資訊」→「仍要執行」。
          展場全螢幕:Mac 在終端機執行 open -a chuanontree --args --kiosk;Windows 執行 chuanontree.exe --kiosk。"
